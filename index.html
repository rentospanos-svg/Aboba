<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#161618">
<title>Смотрим вместе</title>
<style>
:root{--bg:#161618;--card:#222225;--text:#efeae0;--muted:#9b968b;--line:#3a352b;--gold:linear-gradient(135deg,#f8de7e 0%,#d9a520 50%,#a8780f 100%);--gold1:#e2b43a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
.hide{display:none!important}
h1{font-size:24px;margin:8px 0 14px;background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
#joinView{flex:1;overflow:auto;padding:16px;max-width:720px;width:100%;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
label.l{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input[type=text]{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#121214;color:var(--text);font-size:16px}
input[type=text]:focus{outline:none;border-color:var(--gold1)}
button,.btn{display:inline-block;padding:11px 14px;border-radius:12px;border:0;background:var(--gold);color:#1b1405;font-size:15px;font-weight:700;cursor:pointer;text-align:center}
.btn.ghost{background:transparent;color:var(--gold1);border:1px solid var(--gold1)}
.row{display:flex;gap:8px;align-items:center}
.row input[type=text]{flex:1;min-width:0}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
#app{display:none;flex-direction:column;flex:1;min-height:0;width:100%;max-width:720px;margin:0 auto}
#app.on{display:flex}
#player{flex:0 0 28.5vh;flex-basis:28.5svh;background:#000;border-bottom:2px solid var(--gold1)}
#player video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
#bottom{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:8px 12px 10px}
.bar{display:flex;align-items:center;font-size:14px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#666;margin-right:6px}
.dot.on{background:#e2b43a;box-shadow:0 0 8px #e2b43a}
#msg{font-size:13px;color:var(--muted);margin:0}
#msg:empty{display:none}
#chatCard{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.chat{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px 2px}
.m{max-width:80%;padding:8px 12px;border-radius:14px;overflow-wrap:anywhere;font-size:15px}
.m.me{align-self:flex-end;background:var(--gold);color:#1b1405}
.m.them{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
#srcCard{flex:0 0 auto}
#srcCard .btn,#srcCard button{flex:1;padding:10px 8px;font-size:14px}
</style>
</head>
<body>
<div id="joinView">
  <h1>Смотрим вместе</h1>
  <div class="card" id="joinCard">
    <label class="l" for="code">Код комнаты: придумайте длинный и одинаковый у обоих (латиница и цифры)</label>
    <div class="row">
      <input type="text" id="code" maxlength="30" autocapitalize="off" autocomplete="off" placeholder="например: kino8472xz">
      <button id="joinBtn">Войти</button>
    </div>
    <p class="hint" id="joinStatus"></p>
    <p class="hint">Два режима: обычный (оба выбираете один и тот же файл, синхронизируются пауза и перемотка) и трансляция (файл выбирает один, второй видит видео сам; транслировать можно с Android или компьютера в Chrome).</p>
  </div>
</div>

<div id="app">
  <div id="roomCard"><div id="player"><video id="v" controls playsinline preload="auto"></video></div></div>
  <div id="bottom">
    <div class="bar"><span class="dot" id="dot"></span><span id="peersText">Подключаемся…</span></div>
    <p id="msg"></p>
    <div id="chatCard">
      <div class="chat" id="chat"></div>
      <div class="row">
        <input type="text" id="chatIn" maxlength="500" placeholder="Написать сообщение…" autocomplete="off">
        <button id="chatBtn">Отправить</button>
      </div>
    </div>
    <div class="row" id="srcCard">
      <label class="btn ghost">Выбрать видеофайл
        <input type="file" id="file" accept="video/*" class="hide">
      </label>
      <button id="bcBtn">📡 Транслировать</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
var SUPABASE_URL = "https://tsmzrkexzrjffpcwmwpj.supabase.co";
var SUPABASE_KEY = "sb_publishable_HGES6X4jf-AKmT8vhlAxnA_mKd_gthb";

(function(){
  var $ = function(id){return document.getElementById(id)};
  var v = $("v"), ch = null, subscribed = false, applying = false, lastActor = false, objUrl = null;
  var myId = Math.random().toString(36).slice(2);
  var mode = "sync"; // sync | broadcast | viewer
  var pcs = {}, viewerPc = null;
  var ICE = {iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]};

  function say(t){ $("msg").textContent = t || ""; }
  function send(event, payload){
    if(ch && subscribed){ ch.send({type:"broadcast", event:event, payload:payload}); }
  }
  function sendState(){ send("state", {playing:!v.paused, t:v.currentTime}); }

  function user(fn){ return function(){ if(applying || mode === "viewer") return; lastActor = true; fn(); }; }
  v.addEventListener("play", user(sendState));
  v.addEventListener("pause", user(sendState));
  v.addEventListener("seeked", user(sendState));

  function applyState(s){
    if(mode === "viewer" || !s || typeof s.t !== "number") return;
    applying = true; lastActor = false;
    if(Math.abs(v.currentTime - s.t) > 0.8){ v.currentTime = s.t; }
    var p = null;
    if(s.playing && v.paused){ p = v.play(); }
    else if(!s.playing && !v.paused){ v.pause(); }
    if(p && p.catch){ p.catch(function(){ say("Нажми play: браузер не даёт запускать видео сам."); }); }
    setTimeout(function(){ applying = false; }, 400);
  }

  $("file").addEventListener("change", function(e){
    var f = e.target.files && e.target.files[0];
    if(!f || mode === "viewer") return;
    if(objUrl) URL.revokeObjectURL(objUrl);
    objUrl = URL.createObjectURL(f);
    applying = true; v.src = objUrl; v.load();
    setTimeout(function(){ applying = false; }, 400);
    say("Файл: " + f.name + ". Второй должен выбрать такой же.");
  });

  function addMsg(text, mine){
    var box = $("chat"), el = document.createElement("div");
    el.className = "m " + (mine ? "me" : "them");
    el.textContent = text;
    box.appendChild(el);
    box.scrollTop = box.scrollHeight;
  }
  function sendChat(){
    var inp = $("chatIn"), t = inp.value.trim();
    if(!t) return;
    if(!subscribed){ say("Нет связи с комнатой, сообщение не отправлено."); return; }
    send("chat", {text:t});
    addMsg(t, true);
    inp.value = "";
  }
  $("chatBtn").addEventListener("click", sendChat);
  $("chatIn").addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); sendChat(); } });

  function addIce(pc, c){
    if(!pc || !c) return;
    if(pc.remoteDescription){ pc.addIceCandidate(c).catch(function(){}); }
    else { (pc._q = pc._q || []).push(c); }
  }
  function flushIce(pc){
    (pc._q || []).forEach(function(c){ pc.addIceCandidate(c).catch(function(){}); });
    pc._q = [];
  }
  function makeOffer(viewerId){
    if(pcs[viewerId]){ try{ pcs[viewerId].close(); }catch(e){} }
    var pc = new RTCPeerConnection(ICE);
    pcs[viewerId] = pc;
    var stream = v.captureStream ? v.captureStream() : null;
    if(!stream){ return; }
    stream.getTracks().forEach(function(t){ pc.addTrack(t, stream); });
    pc.onicecandidate = function(e){ if(e.candidate) send("ice", {to:viewerId, from:myId, c:e.candidate}); };
    pc.createOffer().then(function(o){ return pc.setLocalDescription(o); }).then(function(){
      send("offer", {to:viewerId, from:myId, sdp:pc.localDescription});
    }).catch(function(){ say("Не удалось начать трансляцию."); });
  }
  function closeBroadcast(){
    Object.keys(pcs).forEach(function(k){ try{ pcs[k].close(); }catch(e){} });
    pcs = {};
  }
  function startBroadcast(){
    if(!v.getAttribute("src")){ say("Сначала выберите видеофайл."); return; }
    if(!v.captureStream){ say("Этот браузер не умеет транслировать. Откройте сайт в Chrome на Android или на компьютере."); return; }
    mode = "broadcast";
    $("bcBtn").textContent = "Остановить трансляцию";
    say("Трансляция идёт. Меняйте паузу и перемотку у себя, второй увидит это сразу.");
    send("bcast", {on:true, from:myId});
  }
  function stopBroadcast(){
    mode = "sync";
    closeBroadcast();
    send("bcast", {on:false, from:myId});
    $("bcBtn").textContent = "📡 Транслировать";
    say("Трансляция остановлена.");
  }
  $("bcBtn").addEventListener("click", function(){
    if(mode === "broadcast") stopBroadcast(); else if(mode === "sync") startBroadcast();
  });
  function onBcast(d){
    if(!d || d.from === myId) return;
    if(d.on){
      if(mode === "broadcast") return;
      mode = "viewer";
      $("srcCard").classList.add("hide");
      say("Идёт трансляция от партнёра…");
      send("want", {id:myId});
    } else if(mode === "viewer"){
      mode = "sync";
      if(viewerPc){ try{ viewerPc.close(); }catch(e){} viewerPc = null; }
      v.srcObject = null;
      $("srcCard").classList.remove("hide");
      say("Трансляция остановлена.");
    }
  }
  function onOffer(d){
    if(mode !== "viewer" || !d || d.to !== myId) return;
    if(viewerPc){ try{ viewerPc.close(); }catch(e){} }
    var pc = new RTCPeerConnection(ICE);
    viewerPc = pc;
    pc.ontrack = function(e){
      v.srcObject = e.streams[0];
      var pr = v.play();
      if(pr && pr.catch){ pr.catch(function(){ say("Нажми play, чтобы начать смотреть."); }); }
      say("");
    };
    pc.onicecandidate = function(e){ if(e.candidate) send("ice", {to:d.from, from:myId, c:e.candidate}); };
    pc.setRemoteDescription(d.sdp).then(function(){ flushIce(pc); return pc.createAnswer(); })
      .then(function(a){ return pc.setLocalDescription(a); })
      .then(function(){ send("answer", {to:d.from, from:myId, sdp:pc.localDescription}); })
      .catch(function(){ say("Не удалось подключиться к трансляции."); });
  }
  function onAnswer(d){
    if(mode !== "broadcast" || !d || d.to !== myId) return;
    var pc = pcs[d.from];
    if(!pc) return;
    pc.setRemoteDescription(d.sdp).then(function(){ flushIce(pc); }).catch(function(){});
  }
  function onIce(d){
    if(!d || d.to !== myId) return;
    addIce(mode === "broadcast" ? pcs[d.from] : viewerPc, d.c);
  }

  function setPeers(n){
    $("dot").className = "dot" + (n > 1 ? " on" : "");
    $("peersText").textContent = n > 1 ? "Вы вместе в комнате" : "Ждём второго…";
  }

  $("joinBtn").addEventListener("click", function(){
    var code = $("code").value.trim().toLowerCase().replace(/[^a-z0-9]/g, "");
    if(code.length < 4){ $("joinStatus").textContent = "Код минимум 4 символа, латиница и цифры."; return; }
    if(!window.supabase){ $("joinStatus").textContent = "Не загрузилась библиотека. Проверьте интернет и обновите страницу."; return; }

    var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    ch = sb.channel("wt-" + code, {config:{broadcast:{self:false}, presence:{key:myId}}});

    ch.on("broadcast", {event:"state"}, function(m){ applyState(m.payload); });
    ch.on("broadcast", {event:"chat"}, function(m){
      if(m.payload && typeof m.payload.text === "string") addMsg(m.payload.text.slice(0,500), false);
    });
    ch.on("presence", {event:"sync"}, function(){ setPeers(Object.keys(ch.presenceState()).length); });
    ch.on("presence", {event:"join"}, function(){
      if(mode === "broadcast"){ send("bcast", {on:true, from:myId}); } else { sendState(); }
    });
    ch.on("broadcast", {event:"bcast"}, function(m){ onBcast(m.payload); });
    ch.on("broadcast", {event:"want"}, function(m){ if(mode === "broadcast" && m.payload) makeOffer(m.payload.id); });
    ch.on("broadcast", {event:"offer"}, function(m){ onOffer(m.payload); });
    ch.on("broadcast", {event:"answer"}, function(m){ onAnswer(m.payload); });
    ch.on("broadcast", {event:"ice"}, function(m){ onIce(m.payload); });

    $("joinStatus").textContent = "Входим…";
    $("joinView").classList.add("hide");
    $("app").classList.add("on");

    var to = setTimeout(function(){
      if(!subscribed){
        $("peersText").textContent = "Не удаётся соединиться";
        say("Проверьте интернет и данные Supabase в index.html, потом обновите страницу.");
      }
    }, 15000);

    ch.subscribe(function(status){
      if(status === "SUBSCRIBED"){
        subscribed = true; clearTimeout(to); say("");
        ch.track({at:Date.now()});
        setPeers(1);
      } else if(status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED"){
        subscribed = false;
        $("peersText").textContent = "Связь потеряна, обновите страницу";
      }
    });

    setInterval(function(){ if(lastActor && !v.paused) sendState(); }, 4000);
  });
})();
</script>
</body>
</html>
